/* page */
let cur=D[0],tok=0;
const tabs=$('#tabs');
tabs.innerHTML=D.map((d,i)=>`<button role="tab" style="--c:${d.c}" data-i="${i}">${d.e} ${d.k}</button>`).join('');
tabs.onclick=e=>{const b=e.target.closest('button');if(b)show(+b.dataset.i)};
const w=ms=>new Promise(r=>setTimeout(r,ms));

function show(i){
 const d=cur=D[i];
 [...tabs.children].forEach((b,j)=>b.setAttribute('aria-selected',j==i));
 const [nmv,vv]=[d.v,d.val];
 $('#lesson').innerHTML=`<article class="card" style="--c:${d.c}">
 <h2>${d.e} ${d.n} <span class="pill">${d.k}</span></h2><div style="color:var(--mut)">${d.tag}</div>
 <p class="what">${d.what}</p>
 <div class="head" style="margin-top:18px"><h3>1. Watch it happen</h3><button class="btn" id="re">↻ Play again</button></div>
 <div class="stage" id="st"><div class="dots"><i></i><i></i><i></i><i></i></div>
 <div class="strip"><code id="cd"></code></div>
 <div class="lg"><span class="l1"><b>${nmv}</b> = the box’s name</span><span class="l2"><b>=</b> puts it inside</span><span class="l3"><b>${vv.replace(/</g,'&lt;')}</b> = the value</span></div>
 <div class="scene"><div class="tag">${nmv}</div><div class="box">${d.vis()}</div><div class="badge">type(${nmv}) ➜ &lt;class '${d.t}'&gt;</div></div>
 <div class="say"><span>🐍</span><p id="cap"></p></div></div>
 <div class="head" style="margin-top:22px"><h3>2. Try it yourself!</h3></div>
 <div class="ed"><pre id="hl" aria-hidden="true"></pre><textarea id="ed" spellcheck="false" autocapitalize="off" aria-label="Python code"></textarea></div>
 <div class="acts"><button class="btn" id="run">▶ Run code</button><button class="btn alt" id="rs">Reset</button></div>
 <div class="out" id="out" aria-live="polite">Press Run to see the magic ✨</div>
 <p class="ch">🎯 Challenge: ${d.ch}</p>
 <div class="head" style="margin-top:18px"><h3>3. Remember</h3></div>
 <ul class="facts">${d.facts.map(f=>`<li>⭐ ${esc(f)}</li>`).join('')}</ul></article>`;
 const ed=$('#ed'),h=$('#hl');
 const sync=()=>{h.innerHTML=hl(ed.value)+'\n ';h.scrollTop=ed.scrollTop;h.scrollLeft=ed.scrollLeft};
 ed.value=d.code;sync();
 ed.oninput=sync;ed.onscroll=()=>{h.scrollTop=ed.scrollTop;h.scrollLeft=ed.scrollLeft};
 const go=()=>{$('#out').innerHTML=run(ed.value).map(o=>`<div${o.e?' class="e"':''}>${esc(o.t)}</div>`).join('')||'Nothing printed. Add a print( ) line!'};
 $('#run').onclick=go;ed.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key=='Enter'){e.preventDefault();go()}};
 $('#rs').onclick=()=>{ed.value=d.code;sync();$('#out').textContent='Code is back to the start. Press Run!'};
 $('#re').onclick=play;play()}

async function play(){
 const my=++tok,d=cur,st=$('#st'),cd=$('#cd'),cap=$('#cap'),dots=st.querySelectorAll('.dots i');
 st.className='stage';cd.innerHTML='';dots.forEach(x=>x.className='');
 const step=(n,msg)=>{if(n)st.classList.add('a'+n);dots[n].className='on';cap.textContent=msg;cap.style.animation='none';cap.offsetWidth;cap.style.animation=''};
 const line=`${d.v} = ${d.val}`;
 step(0,'Let’s write one line of Python. Watch it get typed!');
 for(let i=1;i<=line.length;i++){if(my!=tok)return;cd.innerHTML=hl(line.slice(0,i));await w(70)}
 await w(700);if(my!=tok)return;
 step(1,`Step 1: “${d.v}” is the name on our box. A named box is called a variable!`);
 await w(3200);if(my!=tok)return;
 step(2,`Step 2: the = sign puts the value in the box. ${d.put}`);
 await w(4600);if(my!=tok)return;
 step(3,`Step 3: ask Python “what kind are you?” with type(${d.v}). It answers: ${d.t}! 🎉`)}
show(0);
</script>
